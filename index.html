<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="only light">
  <title>윤정 · 포트폴리오</title>
  <link rel="stylesheet" href="./profile.css">
</head>
<body>
  <main>
    <header class="profile" aria-labelledby="name">
      <div class="portrait" aria-hidden="true">윤</div>
      <div>
        <h1 id="name">윤정</h1>
        <p class="english-name" lang="en">YOONJEONG</p>
        <p class="birth"><time datetime="2000-06">2000년 6월생</time></p>
        <ul class="degrees" aria-label="학위">
          <li><span>문학사</span> 심리학</li>
          <li><span>공학사</span> 소프트웨어학</li>
        </ul>
      </div>
    </header>
    <section aria-labelledby="education">
      <h2 id="education">교육 이력</h2>
      <div class="education-entry">
        <h3>삼성 청년 SW·AI 아카데미</h3>
        <p class="period"><time datetime="2026-01">2026.1</time> ~ <time datetime="2026-12">2026.12</time></p>
      </div>
    </section>
    <section aria-labelledby="skills">
      <h2 id="skills">기술</h2>
      <ul class="skills">
        <li><label for="java" lang="en">Java</label><meter id="java" min="0" max="5" value="4" aria-valuetext="중상"></meter></li>
        <li><label for="python" lang="en">Python</label><meter id="python" min="0" max="5" value="4" aria-valuetext="중상"></meter></li>
        <li><label for="spring" lang="en">Spring</label><meter id="spring" min="0" max="5" value="3" aria-valuetext="중"></meter></li>
        <li><label for="sql" lang="en">SQL</label><meter id="sql" min="0" max="5" value="3" aria-valuetext="중"></meter></li>
        <li><label for="aws" lang="en">AWS</label><meter id="aws" min="0" max="5" value="1" aria-valuetext="하"></meter></li>
      </ul>
    </section>
  </main>
</body>
</html>
